name: Verify

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify single-file script (syntax)
        run: node tests/verify-v3.mjs

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Quiz recognition tests (jsdom)
        run: node tests/quiz-recognition.test.mjs
