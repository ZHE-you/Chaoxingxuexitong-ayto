name: Verify

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build single-file userscript from src/
        run: npm run build

      - name: Verify build output (syntax + engine injected + dist consistent)
        run: node tests/verify-v3.mjs

      - name: Quiz recognition tests (jsdom)
        run: node tests/quiz-recognition.test.mjs

      - name: Build smoke test (engine injected at runtime)
        run: node tests/build-smoke.test.mjs
